<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 720" role="img" aria-label="Augventa">
  <defs>
    <linearGradient id="aFace" x1=".15" y1="0" x2=".7" y2="1">
      <stop offset="0"   stop-color="#ffc21f"/>
      <stop offset=".38" stop-color="#f9971d"/>
      <stop offset="1"   stop-color="#f26a1b"/>
    </linearGradient>
    <linearGradient id="aShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#c74a06" stop-opacity="0"/>
      <stop offset="1"   stop-color="#c74a06" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="ribFace" x1=".1" y1="0" x2=".9" y2=".8">
      <stop offset="0"   stop-color="#ffd75c"/>
      <stop offset=".45" stop-color="#fdb515"/>
      <stop offset="1"   stop-color="#f47c1c"/>
    </linearGradient>
    <linearGradient id="sqFace" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffc21f"/>
      <stop offset="1" stop-color="#f4701b"/>
    </linearGradient>
  </defs>

  <!-- The A: an open chevron, no crossbar -->
  <path fill="url(#aFace)" d="
    M 26 700
    C 12 700 3 685 10 672
    L 300 58
    C 316 24 364 24 380 58
    L 672 672
    C 679 685 670 700 656 700
    L 548 700
    C 538 700 530 694 526 685
    L 348 312
    C 344 304 336 304 332 312
    L 154 685
    C 150 694 142 700 132 700
    Z"/>

  <!-- Lower shading, for the moulded look of the original mark -->
  <path fill="url(#aShade)" d="
    M 26 700
    C 12 700 3 685 10 672
    L 300 58
    C 316 24 364 24 380 58
    L 672 672
    C 679 685 670 700 656 700
    L 548 700
    C 538 700 530 694 526 685
    L 348 312
    C 344 304 336 304 332 312
    L 154 685
    C 150 694 142 700 132 700
    Z"/>

  <!-- Shadow the ribbon casts on the right leg, above its top edge -->
  <path fill="#b8420a" opacity=".5" d="
    M 430 372
    C 530 424 610 528 664 652
    L 672 672
    C 608 516 524 408 424 352
    Z"/>

  <!-- The ribbon sweeping out of the counter to the right -->
  <path fill="url(#ribFace)" d="
    M 302 356
    C 436 322 582 428 670 664
    C 677 682 664 698 648 696
    C 636 694 628 687 624 675
    C 550 474 430 416 304 430
    Z"/>

  <!-- Pixel dissolve, top right -->
  <g fill="url(#sqFace)">
    <rect x="616" y="78"  width="43" height="43" rx="9"/>
    <rect x="558" y="148" width="43" height="43" rx="9"/>
    <rect x="667" y="148" width="47" height="47" rx="10"/>
    <rect x="503" y="218" width="41" height="41" rx="9"/>
    <rect x="593" y="218" width="43" height="43" rx="9"/>
    <rect x="659" y="272" width="36" height="36" rx="8"/>
    <rect x="542" y="296" width="39" height="39" rx="8"/>
  </g>
</svg>
