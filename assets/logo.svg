<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Augventa">
  <defs>
    <linearGradient id="augA" x1="0" y1="1" x2=".8" y2="0">
      <stop offset="0"   stop-color="#e85f00"/>
      <stop offset=".55" stop-color="#ff6b00"/>
      <stop offset="1"   stop-color="#ffa04d"/>
    </linearGradient>
