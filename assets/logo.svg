<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 720" role="img" aria-label="Augventa">
  <defs>
    <linearGradient id="aFace" x1=".12" y1="0" x2=".72" y2="1">
      <stop offset="0"   stop-color="#ffc21f"/>
      <stop offset=".36" stop-color="#f9971d"/>
      <stop offset="1"   stop-color="#f26a1b"/>
    </linearGradient>
    <linearGradient id="aShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#c74a06" stop-opacity="0"/>
      <stop offset=".6" stop-color="#c74a06" stop-opacity=".10"/>
      <stop offset="1"  stop-color="#c74a06" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="ribFace" x1=".05" y1="0" x2=".95" y2=".85">
      <stop offset="0"   stop-color="#ffe07a"/>
      <stop offset=".38" stop-color="#fdb515"/>
      <stop offset="1"   stop-color="#f4791c"/>
    </linearGradient>
    <linearGradient id="sqFace" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffc21f"/>
      <stop offset="1" stop-color="#f4701b"/>
    </linearGradient>

    <!-- The A, reused for the face and the moulded shading on top of it -->
    <path id="aPath" d="
      M 26 700
      C 12 700 3 685 10 672
      L 300 58
      C 316 24 364 24 380 58
      L 676 666
      C 687 685 678 700 661 700
      C 651 700 643 694 639 684
      L 348 312
      C 344 304 336 304 332 312
      L 154 685
      C 150 694 142 700 132 700
      Z"/>
  </defs>

  <!-- The A: an open chevron, no crossbar, right leg tapering to a point -->
  <use href="#aPath" fill="url(#aFace)"/>
  <use href="#aPath" fill="url(#aShade)"/>

  <!-- Shadow the ribbon casts on the right leg, along its upper edge -->
  <path fill="#b03d09" opacity=".55" d="
    M 424 358
    C 522 414 606 518 662 662
    L 654 674
    C 594 546 510 436 418 382
    Z"/>

  <!-- The ribbon sweeping out of the counter and down to the leg tip -->
  <path fill="url(#ribFace)" d="
    M 302 366
    C 436 332 582 434 664 664
    C 670 679 659 693 647 689
    C 639 686 633 679 629 669
    C 554 484 430 424 304 438
    Z"/>

  <!-- Pixel dissolve, top right -->
  <g fill="url(#sqFace)">
    <rect x="616" y="78"  width="43" height="43" rx="9"/>
    <rect x="558" y="148" width="43" height="43" rx="9"/>
    <rect x="667" y="148" width="47" height="47" rx="10"/>
    <rect x="503" y="218" width="41" height="41" rx="9"/>
    <rect x="593" y="218" width="43" height="43" rx="9"/>
    <rect x="659" y="272" width="36" height="36" rx="8"/>
    <rect x="542" y="296" width="39" height="39" rx="8"/>
  </g>
</svg>
