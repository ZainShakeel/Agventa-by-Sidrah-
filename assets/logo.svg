<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 100" role="img" aria-label="Augventa">
  <defs>
    <linearGradient id="augA" x1="0" y1="1" x2="0.85" y2="0">
      <stop offset="0"   stop-color="#E8730A"/>
      <stop offset="0.55" stop-color="#F59320"/>
      <stop offset="1"   stop-color="#FBB03B"/>
    </linearGradient>
    <linearGradient id="augSwoosh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#FBB03B"/>
      <stop offset="1"   stop-color="#DE6A08"/>
    </linearGradient>
  </defs>

  <!-- The A: an open chevron, no crossbar -->
  <path fill="url(#augA)"
        d="M6 90 L44 12 C47 6 55 6 58 12 L96 90 L76 90 L51 36 L26 90 Z"/>

  <!-- Swoosh sweeping out of the counter to the right -->
  <path fill="url(#augSwoosh)" opacity=".92"
        d="M22 72 C46 48 70 54 88 90 L68 90 C56 66 42 62 22 72 Z"/>

  <!-- Pixel dissolve, top right -->
  <g fill="#F59320">
    <rect x="104" y="10" width="8" height="8" rx="1.5"/>
    <rect x="117" y="21" width="6" height="6" rx="1" opacity=".85"/>
    <rect x="101" y="27" width="6" height="6" rx="1" opacity=".7"/>
    <rect x="114" y="36" width="5" height="5" rx="1" opacity=".55"/>
    <rect x="103" y="43" width="4" height="4" rx="1" opacity=".4"/>
  </g>
</svg>
