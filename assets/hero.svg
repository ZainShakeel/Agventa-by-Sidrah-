<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" role="img" aria-label="Illustration of an analytics dashboard with a growth chart, an automation panel, a team card and floating data cubes">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".45" r=".55">
      <stop offset="0"   stop-color="#ffb066" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#ffcf9e" stop-opacity=".16"/>
      <stop offset="1"   stop-color="#ffcf9e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2b47"/>
      <stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6b00"/>
      <stop offset="1" stop-color="#ffb45c"/>
    </linearGradient>
    <linearGradient id="barMute" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e6eaf1"/>
      <stop offset="1" stop-color="#f1f4f8"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b00" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ff6b00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orangeFlat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa04d"/>
      <stop offset="1" stop-color="#f4701b"/>
    </linearGradient>

    <filter id="shLg" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
    <filter id="shMd" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <filter id="shSm" x="-60%" y="-60%" width="220%" height="230%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".15"/>
    </filter>

    <symbol id="cubeO" viewBox="0 0 40 40">
      <polygon points="20,0 40,10 20,20 0,10"   fill="#ffb066"/>
      <polygon points="0,10 20,20 20,40 0,30"   fill="#e85f00"/>
      <polygon points="40,10 40,30 20,40 20,20" fill="#ff7a14"/>
    </symbol>
    <symbol id="cubeD" viewBox="0 0 40 40">
      <polygon points="20,0 40,10 20,20 0,10"   fill="#2a3a57"/>
      <polygon points="0,10 20,20 20,40 0,30"   fill="#0b1526"/>
      <polygon points="40,10 40,30 20,40 20,20" fill="#1b2b47"/>
    </symbol>

    <clipPath id="chartClip"><rect x="176" y="236" width="200" height="120" rx="6"/></clipPath>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="350" cy="290" rx="330" ry="285" fill="url(#glow)"/>

  <!-- orbit rings -->
  <g fill="none" stroke="#ffc79b" stroke-opacity=".55" stroke-dasharray="2 8" stroke-linecap="round">
    <circle cx="350" cy="300" r="262"/>
    <circle cx="350" cy="300" r="310" stroke-opacity=".3"/>
  </g>

  <!-- dot grid, lower left -->
  <g fill="#ffbe8a" opacity=".55">
    <circle cx="42"  cy="470" r="3"/><circle cx="74"  cy="470" r="3"/><circle cx="106" cy="470" r="3"/>
    <circle cx="42"  cy="502" r="3"/><circle cx="74"  cy="502" r="3"/><circle cx="106" cy="502" r="3"/>
    <circle cx="42"  cy="534" r="3"/><circle cx="74"  cy="534" r="3"/><circle cx="106" cy="534" r="3"/>
    <circle cx="42"  cy="566" r="3"/><circle cx="74"  cy="566" r="3"/><circle cx="106" cy="566" r="3"/>
  </g>

  <!-- automation panel, upper right -->
  <g filter="url(#shMd)">
    <rect x="470" y="52" width="196" height="128" rx="20" fill="url(#dark)"/>
    <circle cx="502" cy="88" r="17" fill="#ff6b00" fill-opacity=".18"/>
    <g fill="none" stroke="#ff8a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M502 79v18M493 88h18"/>
      <path d="M496 82l12 12M508 82l-12 12" stroke-opacity=".5"/>
    </g>
    <rect x="532" y="80" width="104" height="8"  rx="4" fill="#ffffff" fill-opacity=".9"/>
    <rect x="532" y="96" width="72"  height="7"  rx="3.5" fill="#ffffff" fill-opacity=".35"/>
    <rect x="494" y="126" width="142" height="7" rx="3.5" fill="#ffffff" fill-opacity=".18"/>
    <rect x="494" y="126" width="92"  height="7" rx="3.5" fill="#ff8a33"/>
    <rect x="494" y="146" width="60"  height="7" rx="3.5" fill="#ffffff" fill-opacity=".18"/>
    <rect x="566" y="146" width="70"  height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
  </g>

  <!-- main dashboard card -->
  <g filter="url(#shLg)">
    <rect x="140" y="118" width="400" height="352" rx="24" fill="url(#card)"/>
    <rect x="140.5" y="118.5" width="399" height="351" rx="23.5" fill="none" stroke="#eef1f6"/>

    <!-- window chrome -->
    <circle cx="170" cy="146" r="5" fill="#ff6b00"/>
    <circle cx="188" cy="146" r="5" fill="#ffd0a8"/>
    <circle cx="206" cy="146" r="5" fill="#e6eaf0"/>
    <rect x="230" y="140" width="110" height="11" rx="5.5" fill="#eef1f6"/>
    <rect x="466" y="138" width="48" height="16" rx="8" fill="#fff2e8"/>
    <rect x="474" y="144" width="32" height="4" rx="2" fill="#ff8a33"/>
    <line x1="140" y1="172" x2="540" y2="172" stroke="#eef1f6" stroke-width="1.4"/>

    <!-- headline metric -->
    <rect x="176" y="194" width="84" height="9"  rx="4.5" fill="#d9dfe8"/>
    <rect x="176" y="211" width="128" height="17" rx="8.5" fill="#0f172a"/>
    <g transform="translate(318 208)">
      <rect width="58" height="22" rx="11" fill="#e8f7ee"/>
      <path d="M14 15l6-7 6 7" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="30" y="8" width="18" height="6" rx="3" fill="#16a34a" fill-opacity=".65"/>
    </g>

    <!-- area chart -->
    <g clip-path="url(#chartClip)">
      <path d="M176 340 L176 316 L216 300 L256 312 L296 268 L336 282 L376 244 L376 356 L176 356 Z" fill="url(#area)"/>
      <path d="M176 316 L216 300 L256 312 L296 268 L336 282 L376 244"
            fill="none" stroke="#ff6b00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="296" cy="268" r="5.5" fill="#fff" stroke="#ff6b00" stroke-width="3"/>
    <circle cx="376" cy="244" r="5.5" fill="#fff" stroke="#ff6b00" stroke-width="3"/>

    <!-- donut -->
    <g transform="translate(462 268)">
      <circle r="42" fill="none" stroke="#eef1f6" stroke-width="16"/>
      <circle r="42" fill="none" stroke="url(#orangeFlat)" stroke-width="16" stroke-linecap="round"
              stroke-dasharray="196 264" transform="rotate(-90)"/>
      <circle r="20" fill="#fff"/>
      <rect x="-13" y="-4" width="26" height="8" rx="4" fill="#0f172a"/>
    </g>

    <!-- bars -->
    <g>
      <rect x="176" y="392" width="20" height="46" rx="6" fill="url(#barMute)"/>
      <rect x="206" y="376" width="20" height="62" rx="6" fill="url(#barMute)"/>
      <rect x="236" y="358" width="20" height="80" rx="6" fill="url(#bar)"/>
      <rect x="266" y="386" width="20" height="52" rx="6" fill="url(#barMute)"/>
      <rect x="296" y="344" width="20" height="94" rx="6" fill="url(#bar)"/>
      <rect x="326" y="370" width="20" height="68" rx="6" fill="url(#barMute)"/>
    </g>

    <!-- side legend -->
    <g>
      <circle cx="384" cy="392" r="5" fill="#ff6b00"/>
      <rect x="396" y="388" width="66" height="8" rx="4" fill="#e6eaf0"/>
      <circle cx="384" cy="414" r="5" fill="#ffc79b"/>
      <rect x="396" y="410" width="48" height="8" rx="4" fill="#eef1f6"/>
      <circle cx="384" cy="436" r="5" fill="#dfe4ec"/>
      <rect x="396" y="432" width="58" height="8" rx="4" fill="#f1f4f8"/>
    </g>
  </g>

  <!-- team card, lower left, overlapping -->
  <g filter="url(#shMd)">
    <rect x="54" y="392" width="214" height="126" rx="20" fill="#ffffff"/>
    <rect x="54.5" y="392.5" width="213" height="125" rx="19.5" fill="none" stroke="#eef1f6"/>
    <g>
      <circle cx="88"  cy="428" r="17" fill="#0f172a"/>
      <circle cx="116" cy="428" r="17" fill="#ff6b00" stroke="#fff" stroke-width="3"/>
      <circle cx="144" cy="428" r="17" fill="#475569" stroke="#fff" stroke-width="3"/>
      <circle cx="172" cy="428" r="17" fill="#ffb45c" stroke="#fff" stroke-width="3"/>
      <circle cx="200" cy="428" r="17" fill="#eef1f6" stroke="#fff" stroke-width="3"/>
      <path d="M194 428h12M200 422v12" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <rect x="78" y="462" width="96" height="9" rx="4.5" fill="#d9dfe8"/>
    <rect x="78" y="482" width="166" height="8" rx="4" fill="#f1f4f8"/>
    <rect x="78" y="482" width="118" height="8" rx="4" fill="url(#orangeFlat)"/>
  </g>

  <!-- cube cluster, lower right -->
  <use href="#cubeO" x="500" y="404" width="96" height="96"/>
  <use href="#cubeD" x="576" y="452" width="64" height="64"/>
  <use href="#cubeO" x="466" y="486" width="58" height="58"/>

  <!-- floating icon badges -->
  <g filter="url(#shSm)">
    <rect x="66" y="180" width="56" height="56" rx="17" fill="#ffffff"/>
    <g fill="none" stroke="#ff6b00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M82 214l8-10 6 5 10-13"/><path d="M100 196h8v8"/>
    </g>

    <rect x="596" y="242" width="56" height="56" rx="17" fill="#ff6b00"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M624 256v28M610 270h28"/>
    </g>

    <rect x="286" y="42" width="52" height="52" rx="16" fill="#ffffff"/>
    <g fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="312" cy="62" r="6"/><path d="M300 80c0-6.6 5.4-10 12-10s12 3.4 12 10"/>
    </g>

    <rect x="386" y="500" width="52" height="52" rx="16" fill="#0b1526"/>
    <g fill="none" stroke="#ff8a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 526h24M412 514v24" stroke-opacity=".35"/>
      <path d="M402 534l8-10 6 5 10-13"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ff6b00">
    <path d="M172 92l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".8"/>
    <path d="M626 372l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".55"/>
    <path d="M112 300l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".4"/>
  </g>
</svg>
