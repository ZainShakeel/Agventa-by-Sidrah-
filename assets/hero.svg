<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-label="Isometric illustration of an illuminated gateway with floating data cubes and dashboard cards">
  <defs>
    <linearGradient id="hGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#ffb066"/>
      <stop offset=".45" stop-color="#ff8a33"/>
      <stop offset="1"   stop-color="#fff2e4"/>
    </linearGradient>
    <linearGradient id="hArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a33"/>
      <stop offset="1" stop-color="#e85f00"/>
    </linearGradient>
    <linearGradient id="hDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233c"/>
      <stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <linearGradient id="hStep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecf3"/>
    </linearGradient>
    <linearGradient id="hSwoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#ff6b00" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff8a33" stop-opacity=".55"/>
      <stop offset="1"  stop-color="#ff6b00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#ffb066" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>

    <filter id="hSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
    <filter id="hSoftSm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>

    <!-- Isometric cube building blocks -->
    <symbol id="cubeO" viewBox="0 0 40 40">
      <polygon points="20,0 40,10 20,20 0,10"   fill="#ffa04d"/>
      <polygon points="0,10 20,20 20,40 0,30"   fill="#e85f00"/>
      <polygon points="40,10 40,30 20,40 20,20" fill="#ff6b00"/>
    </symbol>
    <symbol id="cubeD" viewBox="0 0 40 40">
      <polygon points="20,0 40,10 20,20 0,10"   fill="#233350"/>
      <polygon points="0,10 20,20 20,40 0,30"   fill="#0b1526"/>
      <polygon points="40,10 40,30 20,40 20,20" fill="#16233c"/>
    </symbol>
    <symbol id="cubeW" viewBox="0 0 40 40">
      <polygon points="20,0 40,10 20,20 0,10"   fill="#ffffff"/>
      <polygon points="0,10 20,20 20,40 0,30"   fill="#dfe4ec"/>
      <polygon points="40,10 40,30 20,40 20,20" fill="#eef1f6"/>
    </symbol>

    <clipPath id="archClip">
      <path d="M292 452 L292 266 A88 88 0 0 1 468 266 L468 452 Z"/>
    </clipPath>
  </defs>

  <!-- flowing background lines -->
  <g fill="none" stroke="#eef1f6" stroke-width="1.6">
    <path d="M-20 470 C 150 400, 240 520, 420 440 S 690 330, 790 380"/>
    <path d="M-20 510 C 160 445, 250 560, 430 480 S 700 375, 790 425"/>
  </g>
  <g fill="none" stroke="url(#hSwoosh)" stroke-width="2.4">
    <path d="M600 120 C 680 180, 700 260, 660 350"/>
    <path d="M628 105 C 716 172, 738 262, 692 362"/>
  </g>
  <circle cx="380" cy="320" r="235" fill="url(#hHalo)"/>

  <!-- the gateway -->
  <g filter="url(#hSoft)">
    <!-- outer arch -->
    <path d="M258 452 L258 262 A122 122 0 0 1 502 262 L502 452 Z" fill="url(#hArch)"/>
    <!-- inner opening -->
    <path d="M292 452 L292 266 A88 88 0 0 1 468 266 L468 452 Z" fill="url(#hDark)"/>
    <!-- light pouring out of the opening -->
    <path d="M292 452 L292 266 A88 88 0 0 1 468 266 L468 452 Z" fill="url(#hGlow)" opacity=".92"/>
  </g>

  <!-- skyline inside the arch -->
  <g clip-path="url(#archClip)">
    <g fill="#ffffff" opacity=".78">
      <rect x="306" y="348" width="26" height="104" rx="2"/>
      <rect x="338" y="316" width="20" height="136" rx="2"/>
      <rect x="364" y="290" width="30" height="162" rx="2"/>
      <rect x="400" y="330" width="22" height="122" rx="2"/>
      <rect x="428" y="304" width="26" height="148" rx="2"/>
    </g>
    <g fill="#ff8a33" opacity=".5">
      <rect x="312" y="360" width="5" height="5"/><rect x="322" y="360" width="5" height="5"/>
      <rect x="312" y="374" width="5" height="5"/><rect x="322" y="374" width="5" height="5"/>
      <rect x="344" y="330" width="5" height="5"/><rect x="344" y="346" width="5" height="5"/>
      <rect x="372" y="306" width="5" height="5"/><rect x="384" y="306" width="5" height="5"/>
      <rect x="372" y="322" width="5" height="5"/><rect x="384" y="322" width="5" height="5"/>
      <rect x="406" y="346" width="5" height="5"/><rect x="406" y="362" width="5" height="5"/>
      <rect x="436" y="320" width="5" height="5"/><rect x="446" y="320" width="5" height="5"/>
    </g>
  </g>

  <!-- steps up to the gateway -->
  <g filter="url(#hSoft)">
    <polygon points="286,452 474,452 512,486 248,486" fill="url(#hStep)"/>
    <polygon points="248,486 512,486 512,500 248,500" fill="#d9dfe8"/>
    <polygon points="252,500 508,500 548,534 212,534" fill="url(#hStep)"/>
    <polygon points="212,534 548,534 548,548 212,548" fill="#d9dfe8"/>
    <polygon points="216,548 544,548 588,584 172,584" fill="url(#hStep)"/>
    <polygon points="172,584 588,584 588,598 172,598" fill="#cfd6e1"/>
  </g>

  <!-- isometric cubes -->
  <use href="#cubeO" x="486" y="404" width="86" height="86"/>
  <use href="#cubeO" x="556" y="446" width="62" height="62"/>
  <use href="#cubeD" x="150" y="446" width="70" height="70"/>
  <use href="#cubeW" x="196" y="500" width="54" height="54"/>
  <use href="#cubeO" x="120" y="512" width="46" height="46"/>
  <use href="#cubeW" x="560" y="512" width="48" height="48"/>
  <use href="#cubeO" x="612" y="358" width="40" height="40"/>
  <use href="#cubeD" x="112" y="330" width="34" height="34"/>

  <!-- floating dashboard cards -->
  <g filter="url(#hSoftSm)">
    <!-- avatar card -->
    <rect x="252" y="96" width="52" height="52" rx="13" fill="#fff"/>
    <g fill="none" stroke="#ff6b00" stroke-width="2" stroke-linecap="round">
      <circle cx="278" cy="115" r="6"/>
      <path d="M266 134c0-6.6 5.4-10 12-10s12 3.4 12 10"/>
    </g>

    <!-- bar chart card -->
    <rect x="196" y="182" width="50" height="50" rx="13" fill="#0b1526"/>
    <g fill="#ff8a33">
      <rect x="209" y="208" width="6" height="12" rx="1.5"/>
      <rect x="218" y="200" width="6" height="20" rx="1.5"/>
      <rect x="227" y="193" width="6" height="27" rx="1.5"/>
    </g>

    <!-- lock card -->
    <rect x="322" y="150" width="46" height="46" rx="12" fill="#fff"/>
    <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <rect x="337" y="172" width="16" height="12" rx="2.5"/>
      <path d="M340 172v-4a5 5 0 0 1 10 0v4"/>
    </g>

    <!-- rising line card -->
    <rect x="500" y="82" width="48" height="48" rx="12" fill="#fff"/>
    <g fill="none" stroke="#ff6b00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M512 116l9-11 7 6 10-14"/>
      <path d="M534 97h5v5"/>
    </g>

    <!-- id card -->
    <rect x="566" y="152" width="52" height="52" rx="13" fill="#ff6b00"/>
    <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <circle cx="592" cy="170" r="5.5"/>
      <path d="M581 190c0-6 4.9-9 11-9s11 3 11 9"/>
    </g>

    <!-- image card -->
    <rect x="430" y="126" width="44" height="44" rx="11" fill="#fff"/>
    <g fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round">
      <rect x="441" y="138" width="22" height="18" rx="3"/>
      <path d="M441 152l6-5 5 4 5-6 6 7"/>
    </g>

    <!-- small dark chip -->
    <rect x="620" y="248" width="40" height="40" rx="11" fill="#0b1526"/>
    <g fill="none" stroke="#ff8a33" stroke-width="2" stroke-linecap="round">
      <circle cx="640" cy="268" r="4"/>
      <path d="M640 258v-4M640 282v-4M650 268h4M626 268h4"/>
    </g>
  </g>

  <!-- tiny orange squares dissolving upward, echoing the logo -->
  <g fill="#ff6b00">
    <rect x="146" y="150" width="10" height="10" rx="2" opacity=".85"/>
    <rect x="168" y="126" width="7" height="7" rx="1.5" opacity=".6"/>
    <rect x="132" y="118" width="6" height="6" rx="1.5" opacity=".4"/>
    <rect x="676" y="322" width="9" height="9" rx="2" opacity=".7"/>
    <rect x="700" y="300" width="6" height="6" rx="1.5" opacity=".45"/>
  </g>
</svg>
